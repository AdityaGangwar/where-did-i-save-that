name: Build Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get project source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install app packages
        run: python -m pip install -r requirements.txt

      - name: Build Windows app
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name WhereDidISaveThat --icon assets/app.ico --add-data "assets/app.ico;assets"
          --collect-all customtkinter --collect-all onnxruntime --collect-all tokenizers
          --collect-all pillow_heif --collect-all win32com --hidden-import pythoncom
          --hidden-import pywintypes app.py

      - name: Install Inno Setup compiler
        run: winget install --id JRSoftware.InnoSetup.7 -e --silent --accept-package-agreements --accept-source-agreements

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $compiler) {
            $paths = @(
              (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 7\ISCC.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 7\ISCC.exe'),
              (Join-Path $env:ProgramFiles 'Inno Setup 7\ISCC.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe')
            )
            $compilerPath = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $compilerPath) { throw 'Inno Setup compiler (ISCC.exe) was not found on this runner.' }
          } else {
            $compilerPath = $compiler.Source
          }
          & $compilerPath /Qp WhereDidISaveThat.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed to create the installer.' }

      - name: Publish executable to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist/WhereDidISaveThat-Setup.exe" "dist/WhereDidISaveThat.exe" --title "Where Did I Save That? ${{ github.ref_name }}" --generate-notes

      - name: Save build for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: WhereDidISaveThat-Windows
          path: |
            dist/WhereDidISaveThat-Setup.exe
            dist/WhereDidISaveThat.exe
          retention-days: 14
